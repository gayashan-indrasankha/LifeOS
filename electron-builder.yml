appId: com.habitflow.desktop
productName: LifeOS
asar: false
compression: store
directories:
  app: desktop-stage
  output: dist-desktop
files:
  - '**/*'
  - '!**/*.map'
win:
  icon: desktop/icon.ico
  target:
    - nsis
nsis:
  include: desktop/installer.nsh
  artifactName: 'LifeOS Setup ${version}.exe'
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
