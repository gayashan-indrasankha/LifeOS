plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lifeos.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lifeos.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        def cloudUrl = System.getenv('LIFEOS_CLOUD_URL') ?: ''
        if (cloudUrl) {
            def parsed = new URI(cloudUrl)
            if (parsed.scheme != 'https' || !parsed.host || parsed.userInfo ||
                (parsed.rawPath != '' && parsed.rawPath != '/') || parsed.rawQuery || parsed.rawFragment) {
                throw new GradleException('LIFEOS_CLOUD_URL must be an HTTPS origin without a path.')
            }
            cloudUrl = parsed.scheme + '://' + parsed.authority
        }
        buildConfigField 'String', 'LIFEOS_CLOUD_URL', "\"${cloudUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            assets.srcDirs += [layout.buildDirectory.dir('generated/lifeosAssets')]
            jniLibs.srcDirs += [layout.buildDirectory.dir('generated/lifeosJniLibs')]
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libnode.so']
        }
    }

    signingConfigs {
        release {
            def keystore = System.getenv('LIFEOS_ANDROID_KEYSTORE')
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('LIFEOS_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('LIFEOS_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('LIFEOS_ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('LIFEOS_ANDROID_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def runtimeStage = file('../../android-stage')
def runtimeBinary = file(System.getenv('LIFEOS_ANDROID_NODE_BINARY') ?: '../../.android-toolchain/node/libnode.so')

tasks.register('bundleLifeOsRuntime', Zip) {
    if (!runtimeStage.exists()) {
        throw new GradleException('Run npm run android:prepare before building the APK.')
    }
    from runtimeStage
    archiveFileName = 'lifeos-runtime.zip'
    destinationDirectory = layout.buildDirectory.dir('generated/lifeosAssets')
}

tasks.register('copyLifeOsNode', Copy) {
    if (!runtimeBinary.exists()) {
        throw new GradleException('Place an Android arm64 Node.js executable at .android-toolchain/node/libnode.so.')
    }
    from runtimeBinary
    into layout.buildDirectory.dir('generated/lifeosJniLibs/arm64-v8a')
}

tasks.named('preBuild') {
    dependsOn 'bundleLifeOsRuntime', 'copyLifeOsNode'
}
